<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2a4f2"/>
      <stop offset="40%" stop-color="#e860f0"/>
      <stop offset="100%" stop-color="#c63ad9"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.28" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- pill body -->
  <circle cx="32" cy="32" r="29" fill="url(#pill)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
  <!-- glossy highlight -->
  <circle cx="32" cy="32" r="29" fill="url(#shine)"/>
  <!-- score line -->
  <line x1="15" y1="32" x2="49" y2="32" stroke="#5a0064" stroke-opacity="0.45" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="15" y1="34.5" x2="49" y2="34.5" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1" stroke-linecap="round"/>
  <!-- bottom shading -->
  <path d="M 3 40 A 29 29 0 0 0 61 40 L 61 42 A 29 29 0 0 1 3 42 Z" fill="#000000" fill-opacity="0.12"/>
</svg>
